[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow"
version = "1.0.0"
description = "Plateforme MLOps modulaire, configurable et securisee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
observability = ["prometheus-client>=0.26,<0.27"]
monitoring = ["psutil>=5.9,<8"]
ml = [
    "scikit-learn>=1.6,<2",
    "numpy>=1.24,<3",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
    "mlflow-skinny>=3,<4",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
]
llm = ["mlflow-tracing>=3,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "pytest>=8.0,<10.0",
]

[project.scripts]
signalflow = "signalflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "web/api/tests"]
pythonpath = ["src", "web/api/src"]
addopts = "--import-mode=importlib"
markers = ["postgres: tests sur un PostgreSQL dedicate, actives avec --postgres"]

[tool.setuptools.package-data]
"signalflow.config" = ["schemas/*.json"]
