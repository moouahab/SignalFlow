global:
  scrape_interval: 5s
  evaluation_interval: 10s
  scrape_timeout: 4s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: signalflow
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ['signalflow-exporter:9108']
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - action: labeldrop
        regex: 'container_label_.*'
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
