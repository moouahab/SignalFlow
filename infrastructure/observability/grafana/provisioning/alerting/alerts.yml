apiVersion: 1
groups:
  - orgId: 1
    name: SignalFlow Infrastructure
    folder: SignalFlow
    interval: 30s
    rules:
      - uid: signalflow-target-down
        title: SignalFlow target indisponible
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Une cible de collecte est indisponible
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              expr: 'min(up{job=~"signalflow|node|cadvisor|alloy|loki"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
