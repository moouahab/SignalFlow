name: signalflow-app

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signalflow_app
      POSTGRES_USER: signalflow
      POSTGRES_PASSWORD: ${SIGNALFLOW_POSTGRES_PASSWORD:-signalflow-local}
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U signalflow -d signalflow_app']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *common
    profiles: [jobs]
    build:
      context: .
      dockerfile: web/api/Dockerfile
      target: local
    image: signalflow-app:local
    command: [uvicorn, signalflow_api.app:create_app, --factory, --host, 0.0.0.0, --port, '8000']
    environment:
      SIGNALFLOW_DATABASE_URL: postgresql+psycopg://signalflow:${SIGNALFLOW_POSTGRES_PASSWORD:-signalflow-local}@postgres:5432/signalflow_app
      SIGNALFLOW_DATASET_ROOT: /data/datasets
      SIGNALFLOW_JOB_ROOT: /data/jobs
      SIGNALFLOW_REGISTRY_ROOT: /data/registry
    ports: ['127.0.0.1:8001:8000']
    volumes: [app-datasets:/data/datasets, app-jobs:/data/jobs:ro, app-registry:/data/registry]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *common
    profiles: [jobs]
    image: signalflow-app:local
    build:
      context: .
      dockerfile: web/api/Dockerfile
      target: local
    command: [signalflow-worker]
    environment:
      SIGNALFLOW_DATABASE_URL: postgresql+psycopg://signalflow:${SIGNALFLOW_POSTGRES_PASSWORD:-signalflow-local}@postgres:5432/signalflow_app
      SIGNALFLOW_DATASET_ROOT: /data/datasets
      SIGNALFLOW_JOB_ROOT: /data/jobs
    volumes: [app-datasets:/data/datasets:ro, app-jobs:/data/jobs]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 3g
    cpus: 1
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  app-datasets:
  app-jobs:
  app-registry:
  app-postgres-data:
