[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow-web-api"
version = "0.1.0"
description = "API locale de validation SignalFlow, indépendante du moteur ML"
requires-python = ">=3.11"
dependencies = [
    "signalflow==1.0.0",
    "fastapi>=0.162,<0.163",
    "pydantic>=2.14,<3",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.34,<0.1",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3"]
worker = ["signalflow[ml,monitoring,postgres]==1.0.0"]
postgres = ["signalflow[postgres]==1.0.0", "alembic>=1.13,<2"]

[project.scripts]
signalflow-api = "signalflow_api.__main__:main"
signalflow-worker = "signalflow_api.jobs.worker:main"
signalflow-api-token = "signalflow_api.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
